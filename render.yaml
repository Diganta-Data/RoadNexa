services:
  - type: web
    name: roadnexa-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_RELOAD
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: /tmp/roadnexa/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
