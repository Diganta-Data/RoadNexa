services:
  - type: web
    name: roadnexa-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn iris.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_RELOAD
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: /tmp/roadnexa/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
