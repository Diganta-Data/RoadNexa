# =============================================================================
# IRIS — Road Risk Score Weights Configuration
# =============================================================================
# Weights must sum to 1.0 (100%). Adjust to reflect local priorities.
# These weights are used by the risk scoring engine in iris.risk
# =============================================================================

risk_weights:
  version: "1.0"
  description: "Default road risk scoring weights"

  components:
    accident_risk:
      weight: 0.30
      description: "Historical accident frequency and severity"
    traffic_risk:
      weight: 0.20
      description: "Traffic volume and congestion levels"
    speed_risk:
      weight: 0.15
      description: "Speed limit relative to road type and surroundings"
    road_condition_risk:
      weight: 0.15
      description: "Potholes, surface quality, drainage"
    pedestrian_risk:
      weight: 0.10
      description: "Pedestrian exposure, sidewalks, crossings, nearby schools"
    infrastructure_risk:
      weight: 0.10
      description: "Lighting, signage, barriers, median presence"

  risk_levels:
    very_low:
      min: 0
      max: 20
      label: "VERY_LOW"
      color: "#22c55e"
    low:
      min: 20
      max: 40
      label: "LOW"
      color: "#84cc16"
    moderate:
      min: 40
      max: 60
      label: "MODERATE"
      color: "#eab308"
    high:
      min: 60
      max: 80
      label: "HIGH"
      color: "#f97316"
    critical:
      min: 80
      max: 100
      label: "CRITICAL"
      color: "#ef4444"
